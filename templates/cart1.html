{% extends "layout.html" %}

{% block title %}
    Cart
{% endblock %}

{% set active_page = 'cart' %}
{% block head_include %}
    <script type="module" src="{{ url_for('static', filename = 'cart.js')}}"></script>
{% endblock %}
{% block main %}

<div class="container-sm mt-5 mb-5">
    <div class="card">
        <div class="card-header">
            <div class="row">
                <div class="col">
                    <h3> Your cart</h3>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="cart-row row">
                <div class="cart-body col mb-3">
                    <div class ="Cart-item-header d-flex justify-content-between align-items-center">
                        <h5 class="name">Item Name</h5>
                        <h5 class="price">$15.00</h5>
                    </div>
                    <div class ="cart-item-body">
                        <ul class="flavor-list list-group list-group-flush">
                            <li class="flavor-item list-group-item d-flex justify-content-between align-items-center">
                                <p class="flavor mb-0">Doughnut</p>
                                <p class="quantity mb-0">3</p>
                            </li>
                            <li class="flavor-item list-group-item d-flex justify-content-between align-items-center">
                                <p class="flavor mb-0">Doughnut</p>
                                <p class="quantity mb-0">3</p>
                            </li>
                            <li class="flavor-item list-group-item d-flex justify-content-between align-items-center">
                                <p class="flavor mb-0">Doughnut</p>
                                <p class="quantity mb-0">3</p>
                            </li>                   
                        </ul>
                    </div>
                    <div class ="cart-btns mt-2 col-4 justify-content-end align-items-center">
                        <button class="btn btn-secondary">Edit</button>
                        <button class="btn btn-danger">Remove</button> 
                    </div>   
                </div>
            </div>
            <div class="cart-row row">
                <div class="cart-body col mb-3">
                    <div class ="cart-item-body">
                        <ul class="flavor-list list-group list-group-flush">                
                        </ul>
                    </div>
                    <div class ="cart-btns mt-2 col-4 justify-content-end align-items-center">
                    </div>   
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="row mb-3 justify-content-end align-items-center">
                <div id="flash" class="col-sm-4 text-end text-danger"> </div>
                <div class="col-sm-4 d-flex justify-content-between "> 
                    <div class="w-100 me-2">
                        <label for="pickup date" class="form-label">Pick-up Date:</label>
                        <input type="date" class="form-control " name="pickup date"> 

                    </div>
                    <div class="w-100">
                        <h5 class="mb-2">Total: $<span id="Checkout-total">15.00</span></h5>
                        <button id="checkout-btn" class="btn btn-primary btn-lg w-100 disabled">Checkout</button>
                    </div>
                
                </div>
            </div>
        </div>
    </div>        
</div>
{% endblock %}
